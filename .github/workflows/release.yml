name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches the crate and app versions
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          tag = os.environ['GITHUB_REF_NAME']
          crate = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert tag == 'v' + crate, crate
          for project in ('macos/project.yml', 'ios/project.yml'):
              app = re.search(r'MARKETING_VERSION: (\S+)', open(project).read()).group(1)
              assert tag == 'v' + app, (project, app)
          PY
      - name: Verify CHANGELOG.md has this version
        run: grep -q "^## \\[${GITHUB_REF_NAME#v}\\]" CHANGELOG.md
      - run: rustup toolchain install  # the version and components in rust-toolchain.toml
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo publish --locked --dry-run
  app:
    name: macOS app (Apple Silicon and Intel)
    needs: check
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install xcodegen
      - run: rustup toolchain install
      - run: CONFIGURATION=Release ./build-apple.sh macos-universal
      - name: Ad-hoc sign Payroof.app
        run: |
          app=target/apple-macosx/Build/Products/Release/Payroof.app
          codesign --force --deep --sign - --options runtime --entitlements macos/Wallet.entitlements "$app"
          codesign --verify --strict "$app"
      - name: Pack Payroof.dmg (drag to Applications)
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild==1.6.7
          PATH="$RUNNER_TEMP/dmg/bin:$PATH" apple/make-dmg.sh \
            target/apple-macosx/Build/Products/Release/Payroof.app Payroof.dmg
          mnt="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mnt" Payroof.dmg
          codesign --verify --strict --deep "$mnt/Payroof.app"
          test -L "$mnt/Applications"
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app
          path: Payroof.dmg
          if-no-files-found: error
  release:
    name: GitHub release
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release from this version's CHANGELOG.md section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="[$version]" '/^## /{p = index($0, v) > 0; next} p && !/^\[/' CHANGELOG.md > notes.md
          test -s notes.md
          (cd dist && sha256sum -- *.dmg > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
  crate:
    name: crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
