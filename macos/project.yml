name: PayroofWallet
options:
  deploymentTarget:
    macOS: "15.0"
targets:
  PayroofWallet:
    type: application
    platform: macOS
    # Ships as Payroof.app; the Swift module keeps its name so tests import it unchanged.
    productName: Payroof
    sources:
      - ../apple/Shared
      - App
      - Platform
      # The core library is linked (OTHER_LDFLAGS), never bundled as a resource.
      - path: Generated
        excludes: ["*.a"]
    settings:
      base:
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 3
        PRODUCT_BUNDLE_IDENTIFIER: top.payroof.wallet
        PRODUCT_NAME: Payroof
        PRODUCT_MODULE_NAME: PayroofWallet
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: Scan recovery words to open your wallet
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your wallet
        OTHER_SWIFT_FLAGS: "$(inherited) -I $(SRCROOT)/Generated"
        OTHER_LDFLAGS: "$(inherited) -L $(SRCROOT)/Generated -lpayroof_wallet_core"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Wallet.entitlements
      configs:
        # Release apps are stripped and size-optimised even outside an archive.
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
  PayroofWalletTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: PayroofWallet
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -I $(SRCROOT)/Generated"
