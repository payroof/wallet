name: PayroofWallet
options:
  deploymentTarget:
    iOS: "18.0"
targets:
  PayroofWallet:
    type: application
    platform: iOS
    sources:
      - ../apple/Shared
      - App
      - Platform
      # The core library is linked (OTHER_LDFLAGS), never bundled as a resource.
      - path: Generated
        excludes: ["*.a"]
    settings:
      base:
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: top.payroof.wallet
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: Scan wallet receive addresses, recovery words and Payroof pairing links
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your wallet
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        OTHER_SWIFT_FLAGS: "$(inherited) -I $(SRCROOT)/Generated"
        OTHER_LDFLAGS: "$(inherited) -L $(SRCROOT)/Generated -lpayroof_wallet_core"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Wallet.entitlements
      configs:
        # Release apps are stripped and size-optimised even outside an archive.
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
  PayroofWalletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: PayroofWallet
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: top.payroof.wallet.uitests
        TEST_TARGET_NAME: PayroofWallet
schemes:
  PayroofWallet:
    build:
      targets:
        PayroofWallet: all
    test:
      targets:
        - PayroofWalletUITests
